<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Death Note: Kira's Game</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">

  <!-- LANDING: CREATE OR JOIN -->
  <section id="screen-landing" class="screen">
    <h1 class="title">DEATH NOTE<br><span class="subtitle">Kira's Game</span></h1>
    <div class="card">
      <div id="landing-error" class="error hidden"></div>
      <p id="landing-connecting" class="hint">Connecting...</p>
      <label for="landing-name">Your name</label>
      <input type="text" id="landing-name" placeholder="Your name" maxlength="20">

      <label for="landing-custom-code">Custom room code (optional, host only)</label>
      <input type="text" id="landing-custom-code" placeholder="Leave blank for a random code" maxlength="12" style="text-transform:uppercase">

      <button id="btn-create-game" class="primary" disabled>Create New Game</button>

      <hr>
      <label for="landing-code">Room code</label>
      <input type="text" id="landing-code" placeholder="e.g. KIRA42" maxlength="12" style="text-transform:uppercase">
      <button id="btn-join-game" class="secondary" disabled>Join Game</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen hidden">
    <div id="lobby-content"></div>
  </section>

  <!-- ROLE REVEAL (own device, private) -->
  <section id="screen-reveal" class="screen hidden">
    <div id="reveal-content2"></div>
  </section>

  <!-- MAIN ROUND SCREEN -->
  <section id="screen-round" class="screen hidden">
    <header id="round-header">
      <div id="round-label">Round 1</div>
      <div id="score-label">L: 0 &nbsp;|&nbsp; Kira: 0</div>
    </header>
    <div id="round-content"></div>
    <div id="notes-panel" class="card">
      <button id="btn-notes-toggle" class="secondary" type="button">📝 My Private Notes</button>
      <div id="notes-body" class="hidden">
        <p class="hint">Only you can see this. Jot down suspicions, plans, names people shared — it's saved automatically and stays for the whole game.</p>
        <textarea id="notes-textarea" placeholder="Suspicions, plans, names people shared with you..." maxlength="2000"></textarea>
        <div id="notes-saved-indicator"></div>
      </div>
    </div>
  </section>

  <!-- GAME OVER -->
  <section id="screen-gameover" class="screen hidden">
    <div id="gameover-content"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="app.js?v=12"></script>
</body>
</html>
